name: Build and integration smoke test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-disposable
          MYSQL_DATABASE: freshman_management_demo
          MYSQL_USER: freshman_demo
          MYSQL_PASSWORD: ci-demo-disposable
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-disposable"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['16380:6379']
    env:
      DB_HOST: 127.0.0.1
      DB_NAME: freshman_management_demo
      DB_USER: freshman_demo
      DB_PASSWORD: ci-demo-disposable
      JWT_SECRET: ci-only-disposable-signing-secret-0123456789abcdef
      REDIS_PORT: '16380'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize disposable database
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-tools
          MYSQL_PWD="$DB_PASSWORD" mysql -h 127.0.0.1 -u "$DB_USER" --default-character-set=utf8mb4 "$DB_NAME" < database/01-demo.sql
          MYSQL_PWD="$DB_PASSWORD" mysql -h 127.0.0.1 -u "$DB_USER" --default-character-set=utf8mb4 "$DB_NAME" < database/02-quartz.sql
      - name: Build backend
        run: mvn -B -f backend/pom.xml -DskipTests package
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:prod
      - name: Verify live API flows
        run: |
          pip install -r scripts/requirements.txt
          cd backend
          java -jar ruoyi-admin/target/ruoyi-admin.jar > /tmp/freshman-backend.log 2>&1 &
          cd ..
          python - <<'PY'
          import time,requests
          for _ in range(60):
              try:
                  if requests.get('http://127.0.0.1:18800/captchaImage',timeout=2).status_code==200:break
              except requests.RequestException:pass
              time.sleep(1)
          else:raise SystemExit('Backend did not become ready')
          PY
          python scripts/smoke_test.py
      - name: Backend log on failure
        if: failure()
        run: tail -100 /tmp/freshman-backend.log || true
